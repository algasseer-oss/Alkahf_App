name: Build AlKahf APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack and patch project
        run: |
          unzip -o -q *.zip -d unpacked_project
          find unpacked_project \( -name "settings.gradle*" -o -name "build.gradle*" \) -exec sed -i 's|mavenCentral()|maven { url "https://googleapis.com" }|g' {} +
          find unpacked_project -name "ic_launcher.png.png" -execdir mv {} ic_launcher.png \;
          MANIFEST_PATH=$(find unpacked_project -name "AndroidManifest.xml" | head -n 1)
          cat << 'EOF' > "$MANIFEST_PATH"
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:label="سورة الكهف"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false"
                  android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          GRADLE_DIR=$(find unpacked_project -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          echo "Building in: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/output_apk/" \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlKahf-debug-APK
          path: output_apk/*.apk
