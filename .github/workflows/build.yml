name: Build AlKahf APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -L https://gradle.org -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Unpack project
        run: |
          unzip -o -q *.zip -d unpacked_project
          ls -la unpacked_project

      - name: Build APK
        run: |
          GRADLE_DIR=$(find unpacked_project -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          echo "Building in: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          gradle --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/output_apk/" \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlKahf-debug-APK
          path: output_apk/*.apk
