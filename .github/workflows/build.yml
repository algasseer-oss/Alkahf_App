name: Build AlKahf APK
on:
  workflow_dispatch:
  push:
    paths: ['*.zip', '.github/workflows/build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clean and Build Offline APK
        run: |
          unzip -o -q *.zip -d unpacked_project
          find unpacked_project \( -name "settings.gradle*" -o -name "build.gradle*" \) -exec sed -i 's|mavenCentral()|maven { url "https://googleapis.com" }|g' {} +
          find unpacked_project -name "ic_launcher.png.png" -execdir mv {} ic_launcher.png \;
          echo "" | base64 -d > "$(find unpacked_project -name "AndroidManifest.xml" | head -n 1)"
          ASSETS_DIR=$(find unpacked_project -type d -path "*/src/main/assets" | head -n 1)
          rm -rf "$ASSETS_DIR"/*
          curl -sL "https://archive.org" -o "$ASSETS_DIR/018.mp3"
          curl -s "https://alquran.cloud" > /tmp/surah.json
          cat << 'EOF' > "$ASSETS_DIR/index.html"
          <!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>سورة الكهف</title>
          <link href="https://googleapis.com" rel="stylesheet">
          <style>
          :root{--bg:#f4efe4;--card:#fbf8f1;--border:#d4c3a3;--gold:#9c7a44;--ink:#111}
          body.dark{--bg:#111614;--card:#18201d;--border:#3c3526;--gold:#c9a45c;--ink:#eee7d5}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Amiri Quran','Amiri',serif;display:flex;flex-direction:column}
          .frame{flex:1;margin:8px 8px 4px;background:var(--card);border:1.5px solid var(--border);outline:1px solid var(--border);outline-offset:-5px;border-radius:6px;padding:10px 14px 6px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:opacity .18s}
          .hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:4px;font-family:'Amiri',serif;font-size:15px;color:var(--gold);font-weight:bold}
          .hdr-badge{border:1px solid var(--border);border-radius:12px;padding:1px 10px;background:rgba(156,122,68,.06)}
          .banner{border:1.5px solid var(--gold);background:rgba(156,122,68,.09);border-radius:6px;padding:4px;margin:4px 0;text-align:center;font-size:20px;font-weight:bold;color:var(--gold)}
          .bism{text-align:center;font-size:20px;margin:2px 0 4px;font-weight:bold}
          .txt-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
          .qtxt{font-size:24px;line-height:1.68;text-align:justify;text-align-last:center;word-spacing:1px}
          .vnum{color:var(--gold);font-family:'Amiri',serif;font-size:.86em;margin:0 2px;white-space:nowrap}
          .ftr{border-top:1px solid var(--border);padding-top:4px;display:flex;justify-content:center;align-items:center;gap:8px;font-family:'Amiri',serif;font-size:15px;font-weight:bold;color:var(--gold)}
          .pnum{border:1px solid var(--border);border-radius:14px;padding:0 14px;color:var(--ink);background:rgba(156,122,68,.06)}
          .player{height:46px;padding:4px 8px;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-shrink:0}
          .player span{font:bold 11px sans-serif;color:var(--gold);white-space:nowrap}
          audio{flex:1;height:34px;min-width:100px}
          .nbtn{flex-shrink:0;border:1px solid var(--border);background:none;color:var(--gold);border-radius:8px;padding:4px 8px;font:13px sans-serif}
          @media(orientation:landscape){.frame{margin:3px 6px 2px;padding:6px 14px 4px}.hdr,.ftr{font-size:13px;padding:2px 0}.player{height:36px}}
          </style></head><body>
          <div class="frame" id="card">
            <div class="hdr"><span class="hdr-badge" id="juzBox">الْجُزْءُ الْخَامِسَ عَشَرَ | الْحِزْبُ ٢٩</span><span class="hdr-badge">سُورَةُ الْكَهْفِ</span></div>
            <div class="txt-wrap" id="wrap"><div id="content"></div></div>
            <div class="ftr"><span>۞</span><span class="pnum" id="pnum">٢٩٣</span><span>۞</span></div>
          </div>
          <div class="player">
            <span>ماهر المعيقلي</span>
            <audio controls preload="metadata" src="018.mp3"></audio>
            <button class="nbtn" id="night">☾</button>
          </div>
          <script id="offline-data" type="application/json">__SURAH_JSON__</script>
          <script>
          const content=document.getElementById('content'),wrap=document.getElementById('wrap'),pnum=document.getElementById('pnum'),juzBox=document.getElementById('juzBox'),card=document.getElementById('card');
          let pages={},nums=[],idx=0;
          const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
          function fitText(){const q=document.getElementById('qtxt');if(!q)return;let s=window.innerWidth>window.innerHeight?32:27;q.style.fontSize=s+'px';while(wrap.scrollHeight>wrap.clientHeight&&s>14){s-=0.5;q.style.fontSize=s+'px';}}
          function show(){
            const p=nums[idx],list=pages[p]||[];if(!list.length)return;pnum.textContent=ar(p);
            const j=list.juz,h=Math.ceil(list.hizbQuarter/4);
            juzBox.textContent=(j===16?'الْجُزْءُ السَّادِسَ عَشَرَ':'الْجُزْءُ الْخَامِسَ عَشَرَ')+' | الْحِزْبُ '+ar(h);
            let htm=p===293?'<div class="banner">❁ سُورَةُ الْكَهْفِ ❁</div><div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>':'';
            const v=list.map(a=>{let t=a.text.trim();if(a.numberInSurah===1)t=t.replace(/^بِسۡمِ ٱللَّهِ ٱلرَّحۡمَـٰنِ ٱلرَّحِیمِ\s*/,'');return t+' <span class="vnum">۝'+ar(a.numberInSurah)+'</span> ';}).join('');
            htm+='<div class="qtxt" id="qtxt">'+v+'</div>';content.innerHTML=htm;requestAnimationFrame(fitText);
          }
          function go(n){if(n<0||n>=nums.length)return;card.style.opacity='0.3';setTimeout(()=>{idx=n;localStorage.setItem('k_p',nums[idx]);show();card.style.opacity='1';},120);}
          let sx=0;document.body.addEventListener('touchstart',e=>{sx=e.changedTouches.screenX},{passive:true});
          document.body.addEventListener('touchend',e=>{const d=e.changedTouches.screenX-sx;if(Math.abs(d)>45){if(d>0)go(idx+1);else go(idx-1);}},{passive:true});
          window.addEventListener('resize',()=>requestAnimationFrame(fitText));
          if(localStorage.getItem('k_d')==='1')document.body.classList.add('dark');
          document.getElementById('night').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('k_d',document.body.classList.contains('dark')?'1':'0');};
          (function(){const raw=JSON.parse(document.getElementById('offline-data').textContent);raw.data.ayahs.forEach(a=>{const p=a.page||293;if(!pages[p])pages[p]=[];pages[p].push(a);});nums=Object.keys(pages).map(Number).sort((a,b)=>a-b);idx=Math.max(0,nums.indexOf(parseInt(localStorage.getItem('k_p')||'293',10)));show();})();
          </script></body></html>
          EOF
          python3 -c 'h=open("'"$ASSETS_DIR/index.html"'").read(); j=open("/tmp/surah.json").read(); open("'"$ASSETS_DIR/index.html"'","w").write(h.replace("__SURAH_JSON__", j))'
          GRADLE_DIR=$(find unpacked_project -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          cd "$GRADLE_DIR"
          chmod +x ./gradlew 2>/dev/null || true
          ./gradlew --no-daemon assembleDebug || gradle --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/output_apk/" \;
      - uses: actions/upload-artifact@v4
        with:
          name: AlKahf-debug-APK
          path: output_apk/*.apk
