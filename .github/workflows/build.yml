name: Build AlKahf APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Maven Mirror
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  repositories {
                      all { ArtifactRepository repo ->
                          if (repo instanceof MavenArtifactRepository) {
                              def url = repo.url.toString()
                              if (url.startsWith('https://apache.org') || url.startsWith('https://maven.org')) {
                                  project.logger.lifecycle "Replacing Maven Central with Google Mirror"
                                  remove repo
                              }
                          }
                      }
                      maven { url "https://googleapis.com" }
                  }
              }
              repositories {
                  all { ArtifactRepository repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          def url = repo.url.toString()
                          if (url.startsWith('https://apache.org') || url.startsWith('https://maven.org')) {
                              project.logger.lifecycle "Replacing Maven Central with Google Mirror"
                              remove repo
                          }
                      }
                  }
                  maven { url "https://googleapis.com" }
              }
          }
          EOF

      - name: Unpack project
        run: |
          unzip -o -q *.zip -d unpacked_project
          ls -la unpacked_project

      - name: Build APK
        run: |
          GRADLE_DIR=$(find unpacked_project -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          echo "Building in: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/output_apk/" \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlKahf-debug-APK
          path: output_apk/*.apk
