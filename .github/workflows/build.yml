name: Build AlKahf APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack and patch project
        run: |
          unzip -o -q *.zip -d unpacked_project
          find unpacked_project \( -name "settings.gradle*" -o -name "build.gradle*" \) -exec sed -i 's|mavenCentral()|maven { url "https://googleapis.com" }|g' {} +
          find unpacked_project -name "ic_launcher.png.png" -execdir mv {} ic_launcher.png \;
          python3 -c 'import glob; p = glob.glob("unpacked_project/**/AndroidManifest.xml", recursive=True); a = "android\x3a"; open(p, "w").write(f"<manifest xmlns{a}android=\"http://android.com\"><uses-permission {a}name=\"android.permission.INTERNET\"/><application {a}icon=\"@drawable/ic_launcher\" {a}roundIcon=\"@drawable/ic_launcher\" {a}theme=\"@style/AppTheme\" {a}label=\"سورة الكهف\" {a}usesCleartextTraffic=\"false\" {a}allowBackup=\"false\" {a}supportsRtl=\"true\"><activity {a}name=\".MainActivity\" {a}exported=\"true\"><intent-filter><action {a}name=\"android.intent.action.MAIN\"/><category {a}name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity></application></manifest>")'

      - name: Build APK
        run: |
          GRADLE_DIR=$(find unpacked_project -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          echo "Building in: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/output_apk/" \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlKahf-debug-APK
          path: output_apk/*.apk
